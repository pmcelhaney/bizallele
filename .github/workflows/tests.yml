name: Tests

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - run: npm run format:check
            - run: npm test -- --runInBand
